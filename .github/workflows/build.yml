name: Build Tracker CE Firmware

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  build-firmware:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check for AI bot Co-authored-by trailers
        if: github.event_name == 'pull_request'
        run: |
          BASE_SHA="${{ github.event.pull_request.base.sha }}"
          HEAD_SHA="${{ github.event.pull_request.head.sha }}"
          if git log --format="%B" "$BASE_SHA..$HEAD_SHA" | grep -iE "^Co-authored-by:.*(copilot|claude|cursor|anthropic|openai|gemini|windsurf|aider|coderabbit|devin|\[bot\])"; then
            echo "::error::Please remove AI assistant 'Co-authored-by:' trailers from your commit messages so the repository Contributors list only credits human contributors."
            exit 1
          fi

      - name: Cache GNU Arm Embedded Toolchain 10.3-2021.10
        id: cache-toolchain
        uses: actions/cache@v4
        with:
          path: agt/10.3
          key: arm-none-eabi-10.3-2021.10-linux-x86_64

      - name: Install GNU Arm Embedded Toolchain 10.3-2021.10
        if: steps.cache-toolchain.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y wget bzip2 make python3
          wget -q https://developer.arm.com/-/media/Files/downloads/gnu-rm/10.3-2021.10/gcc-arm-none-eabi-10.3-2021.10-x86_64-linux.tar.bz2
          mkdir -p agt/10.3
          tar -xjf gcc-arm-none-eabi-10.3-2021.10-x86_64-linux.tar.bz2 -C agt/10.3 --strip-components=1
          rm gcc-arm-none-eabi-10.3-2021.10-x86_64-linux.tar.bz2

      - name: Check version configuration
        run: make version

      - name: Build Original Tracker, Tracker+, and Tracker Mini firmware
        run: |
          set -o pipefail
          POSTFIX_ARGS=""
          if [[ "${{ github.ref }}" != refs/tags/v* ]]; then
            SHORT_SHA=$(git rev-parse --short=7 HEAD)
            POSTFIX_ARGS="ORIGINAL_POSTFIX=CE_${SHORT_SHA} PLUS_POSTFIX=CE_${SHORT_SHA} MINI_POSTFIX=CE_${SHORT_SHA}"
          fi
          make all $POSTFIX_ARGS 2>&1 | tee build_output.log

      - name: Build reference .ptfx Sample Editor plugins
        run: |
          make ptfx
          printf "Copy the Effects/ folder to the root directory of your Polyend Tracker microSD card.\n" > editor-fx-sdk/build/README.txt

      - name: Bundle .psyn Synth plugins
        run: |
          make psyn
          rm -rf synth-plugin-sdk/build/package
          mkdir -p synth-plugin-sdk/build/package
          cp -r build/Synths synth-plugin-sdk/build/package/Synths
          cp synth/prebuilt/LICENSE-PROPRIETARY.txt synth-plugin-sdk/build/package/LICENSE-PROPRIETARY.txt
          printf "Copy the Synths/ folder to the root directory of your Polyend Tracker+ or Tracker Mini microSD card.\n" > synth-plugin-sdk/build/package/README.txt

      - name: Publish Firmware Size & Memory Summary
        if: always()
        run: |
          {
            echo "### Generated \`.ptf\` Firmware Files"
            echo "\`\`\`text"
            ls -lh build/*.ptf || true
            echo "\`\`\`"
            echo ""
            echo "### Bundled \`.psyn\` Synth Engines (\`/Synths\`)"
            echo "\`\`\`text"
            ls -lh build/Synths/*.psyn || true
            echo "\`\`\`"
            echo ""
            echo "### Generated \`.ptfx\` Sample Editor Effects (\`/Effects\`)"
            echo "\`\`\`text"
            ls -lh editor-fx-sdk/build/Effects/*.ptfx || true
            echo "\`\`\`"
            echo ""
            echo "### Linker Memory Usage (All 3 Devices)"
            echo "\`\`\`text"
            grep -E "^ Building |=== Building|Memory region|FLASH:|RAM:|EXTERNAL_RAM:|QSPI_FLASH:|SRAM_DTC:|SRAM_ITC:|SRAM_OC:" build_output.log || true
            echo "\`\`\`"
          } > pr_summary.md

          {
            echo "## Polyend Tracker CE - Firmware Build & Memory Summary"
            echo ""
            cat pr_summary.md
            echo ""
            echo "> **Downloads (Bottom of Summary Page)**:"
            echo "> * **\`polyend-tracker-ce-firmware\`**: Ready-to-flash \`.ptf\` firmware files for **Original Tracker**, **Tracker+**, and **Tracker Mini**."
            echo "> * **\`polyend-tracker-ce-synths\`**: Unzip and copy the included **\`Synths/\`** folder directly to the root of your Tracker+ or Tracker Mini microSD card."
            echo "> * **\`polyend-tracker-ce-effects\`**: Unzip and copy the included **\`Effects/\`** folder directly to the root of your Tracker's microSD card."
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "PR_TARGET_NUMBER=${{ github.event.pull_request.number }}"
            echo "PR_SUMMARY_B64=$(base64 -w 0 pr_summary.md)"
          fi

      - name: Upload Firmware Artifacts (.ptf)
        uses: actions/upload-artifact@v4
        with:
          name: polyend-tracker-ce-firmware
          path: build/*.ptf

      - name: Upload Sample Editor Effects Artifact (Effects/*.ptfx)
        uses: actions/upload-artifact@v4
        with:
          name: polyend-tracker-ce-effects
          path: editor-fx-sdk/build/

      - name: Upload Synth Engines Artifact (Synths/*.psyn)
        uses: actions/upload-artifact@v4
        with:
          name: polyend-tracker-ce-synths
          path: synth-plugin-sdk/build/package/

      - name: Post Firmware Download Links to PR (Same-Repo PRs)
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const runId = context.runId;
            const prNumber = context.payload.pull_request.number;
            const shortSha = context.payload.pull_request.head.sha.slice(0, 7);
            const summaryDetails = fs.existsSync('pr_summary.md')
              ? fs.readFileSync('pr_summary.md', 'utf8').trim()
              : '';

            const fwUrl = `https://nightly.link/${owner}/${repo}/actions/runs/${runId}/polyend-tracker-ce-firmware.zip`;
            const synthsUrl = `https://nightly.link/${owner}/${repo}/actions/runs/${runId}/polyend-tracker-ce-synths.zip`;
            const fxUrl = `https://nightly.link/${owner}/${repo}/actions/runs/${runId}/polyend-tracker-ce-effects.zip`;
            const marker = '<!-- polyend-tracker-ce-pr-firmware -->';

            const body = [
              marker,
              '### Polyend Tracker CE Test Firmware, Synth Engines & Sample Editor Effects',
              '',
              'This pull request passed all build checks. You can download and test the built firmware for **Original Tracker**, **Tracker+**, and **Tracker Mini** (`Build: ' + shortSha + '`), the `.psyn` Synth engines, and the `.ptfx` Sample Editor plugins directly using the links below (no GitHub account required):',
              '',
              `* **[Download Firmware (.zip)](${fwUrl})**`,
              `* **[Download Synth Engines (.zip)](${synthsUrl})**`,
              `* **[Download Sample Editor Effects (.zip)](${fxUrl})**`,
              '',
              '<details>',
              '<summary><b>How to Install & Flash on Your Tracker</b></summary>',
              '',
              '### 1. Flashing the Firmware (`.ptf`)',
              `1. Download and unzip **[polyend-tracker-ce-firmware.zip](${fwUrl})**.`,
              '2. Copy the `.ptf` file matching your hardware to the **`/Firmware/`** folder on your Tracker\'s microSD card:',
              `   * **Original Polyend Tracker**: \`PolyendTracker_CE_${shortSha}.ptf\``,
              `   * **Polyend Tracker+**: \`TrackerPlus_CE_${shortSha}.ptf\``,
              `   * **Polyend Tracker Mini**: \`TrackerMini_CE_${shortSha}.ptf\``,
              '3. Insert the microSD card into your Tracker, navigate to **Config → Firmware → Firmware update**, select the `.ptf` file, and confirm.',
              `4. Once rebooted, you can verify you are running this PR build under **Config → Firmware** (\`Build: ${shortSha}\`).`,
              '',
              '### 2. Installing Sample Editor Effects (`.ptfx`)',
              `1. Download and unzip **[polyend-tracker-ce-effects.zip](${fxUrl})**.`,
              '2. Copy the **`Effects/`** folder to the root directory of your Tracker\'s microSD card so your `.ptfx` plugins are located at **`/Effects/*.ptfx`**.',
              '',
              '### 3. Installing Synth Engines (`.psyn` — Tracker+ & Tracker Mini)',
              `1. Download and unzip **[polyend-tracker-ce-synths.zip](${synthsUrl})**.`,
              '2. Copy the **`Synths/`** folder to the root directory of your Tracker+ or Tracker Mini microSD card so your `.psyn` plugins are located at **`/Synths/*.psyn`**.',
              '',
              '### 4. Emergency Recovery (Just in Case)',
              'The Tracker\'s bootloader is hardware-isolated from the firmware. If a test build ever fails to boot:',
              '1. Place a known-good, stable `.ptf` firmware file inside the **`/Firmware/`** folder on your microSD card (ideally as the only `.ptf` file in that folder).',
              '2. Insert the microSD card and power on your Tracker.',
              '3. Use a paperclip or SIM-eject pin to press the **recessed hardware Reset / Emergency Bootloader pinhole button** (on the bottom of Original Tracker / Tracker+, or next to the USB-C port on Tracker Mini). The bootloader will automatically flash the `.ptf` file from `/Firmware/`.',
              '',
              '</details>',
              '',
              '<details>',
              '<summary><b>Firmware File Sizes & Linker Memory Summary</b></summary>',
              '',
              summaryDetails,
              '',
              '</details>'
            ].join('\n');

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number: prNumber,
              per_page: 100
            });
            const existing = comments.find(c => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: existing.id,
                body
              });
            } else {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: prNumber,
                body
              });
            }

      - name: Package .ptfx Effects for GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          cd editor-fx-sdk/build
          zip -r ../../build/PolyendTracker_CE_Effects.zip Effects README.txt

      - name: Package .psyn Synth Engines for GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          cd synth-plugin-sdk/build/package
          zip -r ../../../build/PolyendTracker_CE_Synths.zip Synths README.txt LICENSE-PROPRIETARY.txt

      - name: Publish GitHub Release on Version Tag
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: Polyend Tracker CE ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            build/*.ptf
            build/PolyendTracker_CE_Effects.zip
            build/PolyendTracker_CE_Synths.zip
